# À placer dans le bloc http { } (ex. /etc/nginx/conf.d/) :
limit_conn_zone $binary_remote_addr zone=bn_conn:10m;

server {
    listen 443 ssl http2;
    server_name badges.example.com;

    # ssl_certificate     /etc/letsencrypt/live/badges.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/badges.example.com/privkey.pem;

    root /var/www/badge-server/public;
    index index.php;

    # 10 Mo max par fichier (+ marge pour l'enveloppe multipart)
    client_max_body_size 11m;

    # Images : fichiers statiques, jamais interprétés comme du PHP
    location /uploads/ {
        try_files $uri =404;
        # Débit de téléchargement : 10 Mo/s max par connexion, 10 connexions par IP
        limit_rate 10m;
        limit_conn bn_conn 10;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=86400, immutable" always;
        location ~ \.(php|phtml|phar|html?|svg)$ { return 403; }
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        # INDISPENSABLE pour le bridage d'upload : sans ça nginx absorbe tout le corps
        # à pleine vitesse avant de le passer à PHP, et le débit configuré ne freine rien.
        fastcgi_request_buffering off;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # adapte à ta version
    }

    # Tout autre .php est interdit
    location ~ \.php$ { return 404; }

    # Jamais de fichiers cachés (.htaccess, .user.ini, ...)
    location ~ /\. { deny all; }
}
